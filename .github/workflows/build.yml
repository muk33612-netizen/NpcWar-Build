name: build-asi

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run build.bat
        run: |
          cmd /c build.bat

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NpcWar
          path: |
            NpcWar.asi
            NpcWar.ini
